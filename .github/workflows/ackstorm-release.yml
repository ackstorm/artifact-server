name: Ackstorm Release

# A vX.Y.Z tag publishes ghcr.io/ackstorm/artifact-server:vX.Y.Z, Helm chart
# oci://ghcr.io/ackstorm/charts/artifact-server:X.Y.Z pinned to that image's
# digest, and the GitHub release. The image job installs without the pnpm cache, so nothing a pull
# request can write reaches the published image. A commit that main's full gate already covers skips
# the gate here; scripts/check-release-gate.sh decides, and any doubt runs ci.yml's release tier.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ackstorm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-gate:
    name: Check main's full gate
    if: github.repository == 'ackstorm/artifact-server'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - name: Checkout the tag and its parent
        uses: actions/checkout@v7.0.1 # zizmor: ignore[unpinned-uses] Fork policy pins actions to version tags.
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check main's full gate
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-gate.sh | tee -a "$GITHUB_OUTPUT"

  gate:
    name: Canonical release gate
    needs: main-gate
    if: needs.main-gate.outputs.verified != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      tier: release

  image:
    name: Publish server image and release
    needs: [main-gate, gate]
    if: ${{ !cancelled() && needs.main-gate.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    env:
      ARTIFACTSERVER_IMAGE: ghcr.io/ackstorm/artifact-server:${{ github.ref_name }}
      ARTIFACTSERVER_CHART_REPOSITORY: oci://ghcr.io/ackstorm/charts
      ARTIFACTSERVER_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7.0.1 # zizmor: ignore[unpinned-uses] Fork policy pins actions to version tags.
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0 # zizmor: ignore[unpinned-uses] Fork policy pins actions to version tags.
        with:
          version: 10.34.3
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0 # zizmor: ignore[unpinned-uses] Fork policy pins actions to version tags.
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require the tag to match the release version
        run: node scripts/check-release-version.mjs
      - name: Prepare BuildKit
        uses: docker/setup-buildx-action@v4 # zizmor: ignore[unpinned-uses] Fork policy pins actions to version tags.
      - name: Sign in to Ackstorm GHCR
        env:
          ARTIFACTSERVER_GITHUB_ACTOR: ${{ github.actor }}
          ARTIFACTSERVER_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          docker login ghcr.io --username "$ARTIFACTSERVER_GITHUB_ACTOR" \
            --password-stdin <<< "$ARTIFACTSERVER_GITHUB_TOKEN"
      - name: Require an unused version tag
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$ARTIFACTSERVER_IMAGE" >/dev/null 2>&1; then
            printf 'Refusing to overwrite published image %s.\n' "$ARTIFACTSERVER_IMAGE" >&2
            exit 1
          fi
      - name: Require an unused chart version
        env:
          ARTIFACTSERVER_GITHUB_ACTOR: ${{ github.actor }}
          ARTIFACTSERVER_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          helm() { scripts/with-kubernetes-test-tools.sh helm "$@"; }
          helm registry login ghcr.io --username "$ARTIFACTSERVER_GITHUB_ACTOR" \
            --password-stdin <<< "$ARTIFACTSERVER_GITHUB_TOKEN"
          if helm show chart "$ARTIFACTSERVER_CHART_REPOSITORY/artifact-server" \
            --version "${ARTIFACTSERVER_TAG#v}" >/dev/null 2>&1; then
            printf 'Refusing to overwrite published chart artifact-server %s.\n' \
              "${ARTIFACTSERVER_TAG#v}" >&2
            exit 1
          fi
      - name: Build and publish verified fork image
        env:
          ARTIFACT_SERVER_IMAGE_PUSH: "true"
          ARTIFACT_SERVER_IMAGE_TAGS: ${{ env.ARTIFACTSERVER_IMAGE }}
          ARTIFACT_SERVER_IMAGE_SOURCE: https://github.com/ackstorm/artifact-server
        run: pnpm package:oci release/fork-image
      - name: Verify published image and record delivery metadata
        shell: bash
        run: |
          set -euo pipefail
          expected=$(jq --exit-status --raw-output '.imageIndexDigest' \
            release/fork-image/*.oci.tar.manifest.json)
          actual="sha256:$(docker buildx imagetools inspect --raw \
            "$ARTIFACTSERVER_IMAGE" | sha256sum | cut -d ' ' -f 1)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Published image resolved to %s, expected %s.\n' "$actual" "$expected" >&2
            exit 1
          fi
          {
            printf 'Image: `%s`\n\n' "$ARTIFACTSERVER_IMAGE"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Verified image index: `%s`\n' "$actual"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the Helm chart pinned to the verified image
        shell: bash
        run: |
          set -euo pipefail
          helm() { scripts/with-kubernetes-test-tools.sh helm "$@"; }
          version="${ARTIFACTSERVER_TAG#v}"
          # The previous step proved the registry serves exactly this index digest.
          digest=$(jq --exit-status --raw-output '.imageIndexDigest' \
            release/fork-image/*.oci.tar.manifest.json)
          stage=release/chart
          mkdir -p "$stage"
          cp -R packaging/helm/artifact-server "$stage/"
          ARTIFACTSERVER_IMAGE_DIGEST="$digest" \
            yq --inplace '.image.digest = strenv(ARTIFACTSERVER_IMAGE_DIGEST)' \
              "$stage/artifact-server/values.yaml"
          helm package "$stage/artifact-server" --version "$version" \
            --app-version "$version" --destination "$stage"
          packaged="$stage/artifact-server-$version.tgz"
          if [[ "$(helm show values "$packaged" | yq '.image.digest')" != "$digest" ]]; then
            printf 'Packaged chart does not pin %s.\n' "$digest" >&2
            exit 1
          fi
          helm push "$packaged" "$ARTIFACTSERVER_CHART_REPOSITORY"
          printf '\nHelm chart: `%s/artifact-server:%s`\n' \
            "$ARTIFACTSERVER_CHART_REPOSITORY" "$version" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified fork image
        uses: actions/upload-artifact@v7.0.1 # zizmor: ignore[unpinned-uses] Fork policy pins actions to version tags.
        with:
          name: fork-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/fork-image/*.oci.tar
            release/fork-image/*.oci.tar.manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$ARTIFACTSERVER_TAG"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Artifact Server $ARTIFACTSERVER_TAG"
          --notes "Image: \`$ARTIFACTSERVER_IMAGE\`. Helm chart: \`$ARTIFACTSERVER_CHART_REPOSITORY/artifact-server:${ARTIFACTSERVER_TAG#v}\`"
