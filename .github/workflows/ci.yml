name: CI

on:
  workflow_call:
    inputs:
      tier:
        description: Gate tier to run from a calling workflow
        required: false
        default: release
        type: string
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Gate tier to run on the selected branch
        required: true
        default: full
        type: choice
        options:
          - full
          - pr

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tier }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: PR / Build and static policy
    if: inputs.tier != 'release' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'pr'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.3"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build application
        run: pnpm build
      - name: Validate conformance ledger
        run: pnpm conformance:validate
      - name: Validate conformance test IDs
        run: pnpm conformance:tests
      - name: Upload compiled application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-compiled-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 2

  unit:
    name: PR / Unit and conformance behavior
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'pr')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download compiled application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-compiled-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Verify compiled application
        run: test -f dist/cli/main.js && test -f dist/web/review.html
      - name: Run root behavior and conformance tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test

  browser:
    name: PR / Browser behavior
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'pr')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Download compiled application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-compiled-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Verify compiled web application
        run: test -f dist/web/review.html
      - name: Run browser tests
        run: pnpm test:web:prebuilt
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser/
          if-no-files-found: warn
          retention-days: 7

  portable:
    name: macOS portability
    if: inputs.tier != 'release' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.3"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify portable code paths
        run: pnpm check

  full:
    name: Full / Linux iteration gate
    if: inputs.tier == 'release' || (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.tier == 'full'))
    runs-on: ubuntu-latest
    timeout-minutes: 47
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim unused runner disk
        run: |
          df -h /
          sudo rm -rf -- \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3
      - name: Install Node.js without a release cache
        if: inputs.tier == 'release'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install Node.js with the pnpm cache
        if: inputs.tier != 'release'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.3"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Enable the containerd image store
        run: |
          artifactserver_daemon_config=$(mktemp)
          if [[ -s /etc/docker/daemon.json ]]; then
            jq \
              '.features = ((.features // {}) + {"containerd-snapshotter": true})' \
              /etc/docker/daemon.json > "$artifactserver_daemon_config"
          else
            printf '%s\n' \
              '{"features":{"containerd-snapshotter":true}}' \
              > "$artifactserver_daemon_config"
          fi
          sudo install -d -m 0755 /etc/docker
          sudo install -m 0644 \
            "$artifactserver_daemon_config" \
            /etc/docker/daemon.json
          rm -f -- "$artifactserver_daemon_config"
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' \
            | grep -F 'io.containerd.snapshotter.v1'
      - name: Prepare attestation-capable BuildKit
        run: |
          docker buildx create \
            --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 \
            --name artifact-server-ci \
            --use
          docker buildx inspect --bootstrap

      - name: Run the iteration gate
        run: pnpm verify:iteration

      - name: Upload full-gate reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-gate-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            release/*.manifest.json
            release/*.tgz
          if-no-files-found: error
          retention-days: 14
